<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --bg-raised: #f6f7f9;
      --border: #e3e5e8;
      --text: #1a1d23;
      --text-dim: #5b6270;
      --accent: #6d5ef8;
      --accent-dim: #efecff;
      --code-bg: #f6f7f9;
      --mermaid-theme: default;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161b;
        --bg-raised: #1c1f26;
        --border: #2b2f38;
        --text: #e7e9ee;
        --text-dim: #9aa1ae;
        --accent: #9c8cff;
        --accent-dim: #24203f;
        --code-bg: #1c1f26;
        --mermaid-theme: dark;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    header.site {
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    nav {
      max-width: 860px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav .brand {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      text-decoration: none;
      margin-right: auto;
      letter-spacing: -0.01em;
    }

    nav a.link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    nav a.link:hover { color: var(--accent); }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    h1, h2, h3, h4 {
      line-height: 1.3;
      letter-spacing: -0.015em;
      font-weight: 700;
    }
    h1 { font-size: 2.1rem; margin: 0 0 0.5rem; }
    h2 {
      font-size: 1.4rem;
      margin: 2.75rem 0 0.9rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    h2:first-of-type { margin-top: 2rem; }
    h3 { font-size: 1.1rem; margin: 1.75rem 0 0.6rem; }

    p { color: var(--text); }
    main > p:first-of-type { color: var(--text-dim); font-size: 1.05rem; }

    a { color: var(--accent); }

    ul { padding-left: 1.25rem; }
    li { margin: 0.35rem 0; }
    li strong { color: var(--text); }

    code {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 0.1rem 0.4rem;
      border-radius: 5px;
      font-size: 0.85em;
    }

    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 1rem 1.1rem;
      overflow-x: auto;
      border-radius: 10px;
    }
    pre code { background: none; border: none; padding: 0; font-size: 0.85rem; }

    .mermaid-card {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin: 1.25rem 0 1.75rem;
      overflow-x: auto;
    }
    .mermaid { display: flex; justify-content: center; }
    .mermaid svg { max-width: 100%; }

    hr { display: none; }

    footer {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header class="site">
    <nav>
      <a class="brand" href="{{ '/' | relative_url }}">CppKaiCore</a>
      <a class="link" href="{{ '/' | relative_url }}">Overview</a>
      <a class="link" href="{{ '/architecture' | relative_url }}">Architecture</a>
      <a class="link" href="https://github.com/cschladetsch/CppKaiCore">GitHub ↗</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>Part of the KAI project.</footer>
  <script>
    document.querySelectorAll('pre code.language-mermaid').forEach(function (block) {
      var pre = block.parentElement;
      var card = document.createElement('div');
      card.className = 'mermaid-card';
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = block.textContent;
      card.appendChild(div);
      pre.replaceWith(card);
    });
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({ startOnLoad: true, theme: prefersDark ? 'dark' : 'default', securityLevel: 'loose' });
  </script>
</body>
</html>
